<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#0e0e0e" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc37a" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#9a7b2c" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Outer Fine Border -->
  <rect x="24" y="24" width="752" height="752" fill="none" stroke="#252525" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#1f1f1f" stroke-width="1" />

  <!-- Center Decorative Crest / Monogram -->
  <g transform="translate(400, 360)">
    <!-- Subtle Ambient Glow -->
    <circle r="90" fill="#c9a84c" opacity="0.04" />
    
    <!-- Minimalist Coat Hanger / Luxury Silhouette -->
    <path d="M0 -70 C12 -70, 22 -60, 22 -48 C22 -38, 14 -30, 0 -24 L0 -10 L130 52 C142 58, 142 70, 132 70 L-132 70 C-142 70, -142 58, -130 52 L0 -10 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Diamond Accent -->
    <path d="M0 8 L10 20 L0 32 L-10 20 Z" 
          fill="url(#goldGrad)" 
          opacity="0.85" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="490" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        font-family="-apple-system, BlinkMacSystemFont, 'Cinzel', 'Playfair Display', 'Helvetica Neue', serif" 
        font-size="24" 
        letter-spacing="9" 
        font-weight="600">NT ELEGANZ</text>

  <text x="400" y="525" 
        text-anchor="middle" 
        fill="#777777" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" 
        font-size="12" 
        letter-spacing="5" 
        font-weight="400">LUXURY COLLECTION</text>
</svg>
